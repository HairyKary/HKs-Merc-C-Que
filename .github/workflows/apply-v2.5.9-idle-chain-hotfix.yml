name: Apply v2.5.9 idle-chain hotfix

on:
  push:
    branches:
      - v2.5.9-chain-idle-fix
    paths:
      - .github/workflows/apply-v2.5.9-idle-chain-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5.9-chain-idle-fix
      - name: Patch Merc-C-Que
        shell: python
        run: |
          from pathlib import Path

          path = Path('HKs-Merc-C-Que.user.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace('// @version      2.5.8', '// @version      2.5.9', 1)
          text = text.replace("const VERSION = '2.5.8';", "const VERSION = '2.5.9';", 1)

          old = '''  function remainingChainSeconds() {
    if (state.api.chainTimeout == null || !Number.isFinite(Number(state.api.chainTimeout))) {
      return null;
    }
    const observedAt = Number(state.api.chainTimeoutObservedAt) || Date.now();
    const elapsed = Math.floor((Date.now() - observedAt) / 1000);
    return Math.max(0, Number(state.api.chainTimeout) - elapsed);
  }'''

          new = '''  function remainingChainSeconds() {
    const current = Number(state.api.chainCurrent);
    const timeout = Number(state.api.chainTimeout);
    if (!Number.isFinite(current) || current <= 0 || !Number.isFinite(timeout) || timeout <= 0) {
      return null;
    }
    const observedAt = Number(state.api.chainTimeoutObservedAt) || Date.now();
    const elapsed = Math.floor((Date.now() - observedAt) / 1000);
    return Math.max(0, timeout - elapsed);
  }'''

          if old not in text:
              raise SystemExit('Expected remainingChainSeconds block not found; refusing to patch.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HKs-Merc-C-Que.user.js
          git commit -m "Fix idle chain critical warning"
          git push origin HEAD:v2.5.9-chain-idle-fix
