name: Format v2.5.9 idle-chain hotfix

on:
  push:
    branches:
      - v2.5.9-chain-idle-fix
    paths:
      - .github/workflows/apply-v2.5.9-idle-chain-hotfix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: v2.5.9-chain-idle-fix

      - name: Normalize helper formatting
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('HKs-Merc-C-Que.user.js')
          text = path.read_text(encoding='utf-8')

          replacement = (
              "  function remainingChainSeconds() {\n"
              "    const current = Number(state.api.chainCurrent);\n"
              "    const timeout = Number(state.api.chainTimeout);\n"
              "    if (!Number.isFinite(current) || current <= 0 || !Number.isFinite(timeout) || timeout <= 0) {\n"
              "      return null;\n"
              "    }\n"
              "    const observedAt = Number(state.api.chainTimeoutObservedAt) || Date.now();\n"
              "    const elapsed = Math.floor((Date.now() - observedAt) / 1000);\n"
              "    return Math.max(0, timeout - elapsed);\n"
              "  }\n\n"
              "  function isTransientError"
          )

          pattern = r'\s*function remainingChainSeconds\(\) \{.*?\n\}\n\nfunction isTransientError'
          text, count = re.subn(pattern, "\n\n" + replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one hotfix block; found {count}. Refusing to format.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit formatting cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HKs-Merc-C-Que.user.js
          git commit -m "Clean up v2.5.9 hotfix formatting"
          git push origin HEAD:v2.5.9-chain-idle-fix
