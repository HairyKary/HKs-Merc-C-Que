name: Fix v2.5.11 chain reset

on:
  push:
    branches:
      - v2.5.11-clock-safety
    paths:
      - .github/workflows/fix-v2.5.11-chain-reset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5.11-clock-safety

      - name: Fix stale auto hit number after broken chain
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('HKs-Merc-C-Que.user.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "      const before = chainSnapshot();\n      const hadSyncError = hasSyncError();\n      const chain = data?.chain || null;\n\n      if (chain) {",
              "      const before = chainSnapshot();\n      const hadSyncError = hasSyncError();\n      const chain = data?.chain || null;\n      const chainCurrentValue = Number(chain?.current) || 0;\n      const chainTimeoutValue = Number(chain?.timeout) || 0;\n      const activeChain = !!chain && chainCurrentValue > 0 && chainTimeoutValue > 0;\n\n      if (activeChain) {",
              'active chain detection'
          )

          replace_once(
              "        const newCurrent = Number(chain.current) || 0;",
              "        const newCurrent = chainCurrentValue;",
              'reuse parsed chain current'
          )

          replace_once(
              "        const acceptedCurrent = sameChain && Number.isFinite(previousCurrent) && newCurrent < previousCurrent\n          ? previousCurrent : newCurrent;",
              "        const acceptedCurrent = sameChain && Number.isFinite(previousCurrent)\n          && previousCurrent >= 10 && newCurrent >= 10 && newCurrent < previousCurrent\n          ? previousCurrent : newCurrent;",
              'allow broken chain and warmup reset'
          )

          replace_once(
              "        state.api.chainTimeout = Number(chain.timeout);",
              "        state.api.chainTimeout = chainTimeoutValue;",
              'reuse parsed chain timeout'
          )

          replace_once(
              "        state.api.chainTimeout = null;\n        state.api.chainTimeoutObservedAt = 0;\n        chainDeadlineTornMs = 0;",
              "        state.api.chainTimeout = null;\n        state.api.chainTimeoutObservedAt = 0;\n        state.manualNextHit = 1;\n        chainDeadlineTornMs = 0;\n        dangerAlertedForHit = null;\n        criticalAlertedForHit = null;",
              'reset inactive chain state'
          )

          path.write_text(text, encoding='utf-8')
          PY

          node --check HKs-Merc-C-Que.user.js
          grep -q "const activeChain = !!chain && chainCurrentValue > 0 && chainTimeoutValue > 0" HKs-Merc-C-Que.user.js
          grep -q "previousCurrent >= 10 && newCurrent >= 10" HKs-Merc-C-Que.user.js
          grep -q "state.manualNextHit = 1;" HKs-Merc-C-Que.user.js

      - name: Commit chain reset fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HKs-Merc-C-Que.user.js
          git commit -m "Reset auto hit number after broken chain"
          git push origin HEAD:v2.5.11-clock-safety
