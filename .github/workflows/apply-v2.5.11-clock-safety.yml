name: Apply v2.5.11 clock safety patch

on:
  push:
    branches:
      - v2.5.11-clock-safety
    paths:
      - .github/workflows/apply-v2.5.11-clock-safety.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5.11-clock-safety

      - name: Patch and verify userscript
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('HKs-Merc-C-Que.user.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('// @version      2.5.10', '// @version      2.5.11'),
              ("const VERSION = '2.5.10';", "const VERSION = '2.5.11';"),
              ('  const CRITICAL_SECONDS = 30;\n', '  const CRITICAL_SECONDS = 30;\n  const CHAIN_CLOCK_SAFETY_SECONDS = 3;\n'),
              ('    return Math.max(0, timeout - elapsed);', '    return Math.max(0, timeout - elapsed - CHAIN_CLOCK_SAFETY_SECONDS);'),
              ('// @updateURL    https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/main/HKs-Merc-C-Que.user.js', '// @updateURL    https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/v2.5.11-clock-safety/HKs-Merc-C-Que.user.js'),
              ('// @downloadURL  https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/main/HKs-Merc-C-Que.user.js', '// @downloadURL  https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/v2.5.11-clock-safety/HKs-Merc-C-Que.user.js'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match for {old!r}; found {count}.')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          node --check HKs-Merc-C-Que.user.js
          grep -q "// @version      2.5.11" HKs-Merc-C-Que.user.js
          grep -q "const VERSION = '2.5.11';" HKs-Merc-C-Que.user.js
          grep -q "CHAIN_CLOCK_SAFETY_SECONDS = 3" HKs-Merc-C-Que.user.js
          grep -q "timeout - elapsed - CHAIN_CLOCK_SAFETY_SECONDS" HKs-Merc-C-Que.user.js
          grep -q "v2.5.11-clock-safety/HKs-Merc-C-Que.user.js" HKs-Merc-C-Que.user.js

      - name: Commit test patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HKs-Merc-C-Que.user.js
          git commit -m "Add 3-second chain clock safety buffer"
          git push origin HEAD:v2.5.11-clock-safety
