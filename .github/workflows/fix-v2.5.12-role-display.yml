name: Fix v2.5.12 role display

on:
  push:
    branches:
      - v2.5.12-multitab-sync
    paths:
      - .github/workflows/fix-v2.5.12-role-display.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5.12-multitab-sync
      - run: python3 .github/scripts/fix-v2.5.12-role-display.py
      - run: node --check HKs-Merc-C-Que.user.js
      - run: grep -Fq 'Tab API role:' HKs-Merc-C-Que.user.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HKs-Merc-C-Que.user.js
          git commit -m 'Show tab API role when settings open'
          git push origin HEAD:v2.5.12-multitab-sync
