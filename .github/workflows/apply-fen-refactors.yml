      - name: Syntax check
        run: node --check HKs-Merc-C-Que.user.js

      - name: Commit reviewed refactors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HKs-Merc-C-Que.user.js
          git commit -m "Integrate reviewed Fen_X refactors"
          git push origin HEAD:fen-refactor-review
