name: Optimize v2.5.12 multi-tab sync

on:
  push:
    branches:
      - v2.5.12-multitab-sync
    paths:
      - .github/workflows/optimize-v2.5.12.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5.12-multitab-sync
      - name: Apply optimization patch
        run: python3 .github/scripts/optimize-v2.5.12.py
      - name: Verify userscript
        run: |
          node --check HKs-Merc-C-Que.user.js
          git diff --check
          if git diff --quiet -- HKs-Merc-C-Que.user.js; then
            echo 'No userscript changes were produced.' >&2
            exit 1
          fi
      - name: Commit optimized userscript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HKs-Merc-C-Que.user.js
          git commit -m 'Optimize v2.5.12 multi-tab synchronization'
          git push origin v2.5.12-multitab-sync
