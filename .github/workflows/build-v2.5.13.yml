name: Build v2.5.13 PDA tempo bulk

on:
  push:
    branches:
      - v2.5.13-pda-tempo-bulk
    paths:
      - .github/workflows/build-v2.5.13.yml
      - .github/scripts/build-v2.5.13.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5.13-pda-tempo-bulk
      - name: Fix one-time URL replacement helper
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/build-v2.5.13.py')
          s = p.read_text(encoding='utf-8')
          old = """replace_once('https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/v2.5.12-multitab-sync/HKs-Merc-C-Que.user.js',
                       'https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/v2.5.13-pda-tempo-bulk/HKs-Merc-C-Que.user.js',
                       'update url')
          replace_once('https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/v2.5.12-multitab-sync/HKs-Merc-C-Que.user.js',
                       'https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/v2.5.13-pda-tempo-bulk/HKs-Merc-C-Que.user.js',
                       'download url')"""
          new = """old_branch_url = 'https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/v2.5.12-multitab-sync/HKs-Merc-C-Que.user.js'
          new_branch_url = 'https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/v2.5.13-pda-tempo-bulk/HKs-Merc-C-Que.user.js'
          if text.count(old_branch_url) != 2:
              raise SystemExit(f'branch urls: expected 2 matches, found {text.count(old_branch_url)}')
          text = text.replace(old_branch_url, new_branch_url)"""
          if old not in s:
              raise SystemExit('Could not locate URL replacement block in build script')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply v2.5.13 patch
        run: python3 .github/scripts/build-v2.5.13.py
      - name: Verify userscript
        run: |
          node --check HKs-Merc-C-Que.user.js
          git diff --check
          grep -q "@version      2.5.13" HKs-Merc-C-Que.user.js
          grep -q "const VERSION = '2.5.13'" HKs-Merc-C-Que.user.js
          grep -q "recordAllPendingHits" HKs-Merc-C-Que.user.js
          grep -q "hitTempoState" HKs-Merc-C-Que.user.js
          grep -q "compactPanel" HKs-Merc-C-Que.user.js
          if git diff --quiet -- HKs-Merc-C-Que.user.js; then
            echo 'No userscript changes were produced.' >&2
            exit 1
          fi
      - name: Commit v2.5.13 test build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HKs-Merc-C-Que.user.js
          git commit -m 'Build v2.5.13 compact PDA tempo and bulk actions'
          git push origin v2.5.13-pda-tempo-bulk
