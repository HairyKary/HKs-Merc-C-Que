name: Refine v2.5.12 tab leader

on:
  push:
    branches:
      - v2.5.12-multitab-sync
    paths:
      - .github/workflows/refine-v2.5.12-leader.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5.12-multitab-sync
      - name: Refine leader preference and role UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('HKs-Merc-C-Que.user.js')
          s = p.read_text(encoding='utf-8')
          def r(old,new,label):
              global s
              c=s.count(old)
              if c!=1: raise SystemExit(f'{label}: expected 1, found {c}')
              s=s.replace(old,new,1)
          r("  let lastLeaderRenewAt = 0;\n  let wasApiLeader = false;",
            "  let lastLeaderRenewAt = 0;\n  let wasApiLeader = false;\n  let lastReportedTabRole = '';", 'role cache')
          r("        const renewed = { id: TAB_ID, expiresAt: now + API_LEADER_LEASE_MS };",
            "        const renewed = { id: TAB_ID, expiresAt: now + API_LEADER_LEASE_MS, visible: !document.hidden };", 'renew visible')
          r("    if (lease?.id && Number(lease.expiresAt) > now) {\n      wasApiLeader = false;\n      return false;\n    }\n\n    const candidate = { id: TAB_ID, expiresAt: now + API_LEADER_LEASE_MS };",
            "    if (lease?.id && Number(lease.expiresAt) > now) {\n      const visibleCanPreemptHidden = !document.hidden && lease.visible === false;\n      if (!visibleCanPreemptHidden) {\n        wasApiLeader = false;\n        return false;\n      }\n    }\n\n    const candidate = { id: TAB_ID, expiresAt: now + API_LEADER_LEASE_MS, visible: !document.hidden };", 'visible preemption')
          r("    const leader = maintainApiLeadership();\n    if (leader) runDangerAlerts();",
            "    const leader = maintainApiLeadership();\n    const role = tabApiRole();\n    if (role !== lastReportedTabRole) {\n      lastReportedTabRole = role;\n      updateApiStatusBox();\n    }\n    if (leader) runDangerAlerts();", 'role refresh')
          r("    lastVisibilityChangeAt = now;\n    if (document.hidden) persistPdaUiState();",
            "    lastVisibilityChangeAt = now;\n    if (isApiLeader()) maintainApiLeadership();\n    if (document.hidden) persistPdaUiState();", 'visibility lease refresh')
          p.write_text(s,encoding='utf-8')
          PY
          node --check HKs-Merc-C-Que.user.js
          grep -Fq 'visibleCanPreemptHidden' HKs-Merc-C-Que.user.js
          grep -Fq 'visible: !document.hidden' HKs-Merc-C-Que.user.js
          grep -Fq 'lastReportedTabRole' HKs-Merc-C-Que.user.js
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HKs-Merc-C-Que.user.js
          git commit -m 'Prefer visible tab for API leadership'
          git push origin HEAD:v2.5.12-multitab-sync
