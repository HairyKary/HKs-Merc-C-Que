name: Patch v2.5 startup

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - HKs-Merc-C-Que.user.js
      - trigger-v25-fix.txt

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'v2.5-pda-resilience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5-pda-resilience
      - name: Patch startup initialization
        shell: python
        run: |
          from pathlib import Path
          path = Path('HKs-Merc-C-Que.user.js')
          text = path.read_text(encoding='utf-8')
          old = "  const clone = value => JSON.parse(JSON.stringify(value));"
          new = "  function clone(value) { return JSON.parse(JSON.stringify(value)); }"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected clone helper not found')
          text = text.replace('// @version      2.5.0', '// @version      2.5.1', 1)
          text = text.replace("const VERSION = '2.5.0';", "const VERSION = '2.5.1';", 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify syntax
        run: node --check HKs-Merc-C-Que.user.js
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo "Startup fix already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HKs-Merc-C-Que.user.js
          git commit -m "Fix v2.5 startup initialization order"
          git push origin v2.5-pda-resilience
