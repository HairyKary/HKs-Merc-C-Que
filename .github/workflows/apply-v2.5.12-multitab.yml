name: Apply v2.5.12 multi-tab sync

on:
  push:
    branches:
      - v2.5.12-multitab-sync
    paths:
      - .github/workflows/apply-v2.5.12-multitab.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5.12-multitab-sync
      - name: Apply multi-tab synchronization
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('HKs-Merc-C-Que.user.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          text = text.replace('// @version      2.5.11', '// @version      2.5.12', 1)
          text = text.replace("const VERSION = '2.5.11';", "const VERSION = '2.5.12';", 1)
          text = text.replace(
              'https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/main/HKs-Merc-C-Que.user.js',
              'https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/v2.5.12-multitab-sync/HKs-Merc-C-Que.user.js'
          )

          replace_once(
              "  const PDA_SESSION_DISMISS_STORE = 'hkmcq_pda_launcher_dismissed';\n  const MAX_HISTORY = 40;",
              "  const PDA_SESSION_DISMISS_STORE = 'hkmcq_pda_launcher_dismissed';\n  const TAB_SYNC_CHANNEL_NAME = 'hksMercCQue_v2_tab_sync';\n  const TAB_SHARED_STATE_STORE = 'hksMercCQue_v2_shared_state';\n  const TAB_LEADER_STORE = 'hksMercCQue_v2_api_leader';\n  const API_LEADER_LEASE_MS = 4000;\n  const API_LEADER_RENEW_MS = 1200;\n  const MAX_HISTORY = 40;",
              'sync constants'
          )

          replace_once(
              "  let tornClockSyncInFlight = false;\n  let chainDeadlineTornMs = 0;",
              "  let tornClockSyncInFlight = false;\n  let chainDeadlineTornMs = 0;\n  const TAB_ID = (() => {\n    try { if (crypto?.randomUUID) return crypto.randomUUID(); } catch {}\n    return `${Date.now()}-${Math.random().toString(36).slice(2)}`;\n  })();\n  let syncChannel = null;\n  let sharedSequence = 0;\n  let lastSharedStamp = { updatedAt: 0, sourceId: '', sequence: 0 };\n  let lastPublishedSharedJson = '';\n  let lastLeaderRenewAt = 0;\n  let wasApiLeader = false;",
              'sync runtime variables'
          )

          old_save = '''  function saveNow() {
    clearTimeout(saveTimer);
    saveTimer = null;
    state.schemaVersion = SCHEMA_VERSION;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (error) {
      console.warn('[Merc-C-Que] State save failed:', error);
    }
    persistPdaUiState();
  }
'''

          new_save = '''  function buildSharedSnapshot() {
    const api = clone(state.api);
    delete api.lastAttackPoll;
    delete api.lastChainPoll;
    return {
      schemaVersion: state.schemaVersion,
      roster: clone(state.roster),
      manualNextHit: state.manualNextHit,
      template: state.template,
      ui: clone(state.ui),
      ledger: clone(state.ledger),
      api,
      history: clone(history),
      runtime: {
        lastUpName,
        upSince,
        tornClockOffsetMs,
        tornClockSyncedAt,
        chainDeadlineTornMs,
        dangerAlertedForHit,
        criticalAlertedForHit
      }
    };
  }

  function sharedStampIsNewer(envelope) {
    const updatedAt = Number(envelope?.updatedAt) || 0;
    const sourceId = String(envelope?.sourceId || '');
    const sequence = Number(envelope?.sequence) || 0;
    if (updatedAt !== lastSharedStamp.updatedAt) return updatedAt > lastSharedStamp.updatedAt;
    if (sourceId !== lastSharedStamp.sourceId) return sourceId > lastSharedStamp.sourceId;
    return sequence > lastSharedStamp.sequence;
  }

  function recordSharedStamp(envelope) {
    lastSharedStamp = {
      updatedAt: Number(envelope?.updatedAt) || 0,
      sourceId: String(envelope?.sourceId || ''),
      sequence: Number(envelope?.sequence) || 0
    };
  }

  function publishSharedState(force = false) {
    const snapshot = buildSharedSnapshot();
    const snapshotJson = JSON.stringify(snapshot);
    if (!force && snapshotJson === lastPublishedSharedJson) return;

    const envelope = {
      type: 'state',
      sourceId: TAB_ID,
      updatedAt: Date.now(),
      sequence: ++sharedSequence,
      snapshot
    };
    lastPublishedSharedJson = snapshotJson;
    recordSharedStamp(envelope);

    try { localStorage.setItem(TAB_SHARED_STATE_STORE, JSON.stringify(envelope)); }
    catch (error) { console.warn('[Merc-C-Que] Shared-state save failed:', error); }
    try { syncChannel?.postMessage(envelope); } catch {}
  }

  function applySharedEnvelope(envelope) {
    if (!envelope || envelope.type !== 'state' || envelope.sourceId === TAB_ID) return false;
    if (!sharedStampIsNewer(envelope)) return false;
    const shared = envelope.snapshot;
    if (!shared || typeof shared !== 'object') return false;

    const lastAttackPoll = state.api.lastAttackPoll;
    const lastChainPoll = state.api.lastChainPoll;
    state.roster = Array.isArray(shared.roster) ? shared.roster.map(normalizeParticipant) : state.roster;
    state.manualNextHit = Math.max(1, Number(shared.manualNextHit) || 1);
    state.template = typeof shared.template === 'string' ? shared.template : state.template;
    state.ui = { ...state.ui, ...(shared.ui || {}) };
    state.ledger = normalizeLedger(shared.ledger);
    state.api = normalizeApi({
      ...state.api,
      ...(shared.api || {}),
      lastAttackPoll,
      lastChainPoll
    });
    history = Array.isArray(shared.history) ? clone(shared.history).slice(-MAX_HISTORY) : history;

    const runtime = shared.runtime || {};
    lastUpName = String(runtime.lastUpName || '');
    upSince = Number(runtime.upSince) || Date.now();
    tornClockOffsetMs = Number(runtime.tornClockOffsetMs) || 0;
    tornClockSyncedAt = Number(runtime.tornClockSyncedAt) || 0;
    chainDeadlineTornMs = Number(runtime.chainDeadlineTornMs) || 0;
    dangerAlertedForHit = runtime.dangerAlertedForHit ?? null;
    criticalAlertedForHit = runtime.criticalAlertedForHit ?? null;

    recordSharedStamp(envelope);
    lastPublishedSharedJson = JSON.stringify(buildSharedSnapshot());
    refresh({ roster: true, pending: true, settings: true });
    return true;
  }

  function initTabSync() {
    try {
      if (typeof BroadcastChannel === 'function') {
        syncChannel = new BroadcastChannel(TAB_SYNC_CHANNEL_NAME);
        syncChannel.addEventListener('message', event => applySharedEnvelope(event.data));
      }
    } catch (error) {
      console.warn('[Merc-C-Que] BroadcastChannel unavailable; using storage sync:', error);
      syncChannel = null;
    }

    window.addEventListener('storage', event => {
      if (event.key !== TAB_SHARED_STATE_STORE || !event.newValue) return;
      try { applySharedEnvelope(JSON.parse(event.newValue)); } catch {}
    });

    let existing = null;
    try {
      const raw = localStorage.getItem(TAB_SHARED_STATE_STORE);
      if (raw) existing = JSON.parse(raw);
    } catch {}
    if (!applySharedEnvelope(existing)) publishSharedState(true);
  }

  function readApiLeaderLease() {
    try {
      const raw = localStorage.getItem(TAB_LEADER_STORE);
      if (!raw) return null;
      const lease = JSON.parse(raw);
      return lease && lease.id ? lease : null;
    } catch {
      return null;
    }
  }

  function isApiLeader() {
    const lease = readApiLeaderLease();
    return !!lease && lease.id === TAB_ID && Number(lease.expiresAt) > Date.now();
  }

  function releaseApiLeadership() {
    const lease = readApiLeaderLease();
    if (lease?.id === TAB_ID) {
      try { localStorage.removeItem(TAB_LEADER_STORE); } catch {}
    }
    wasApiLeader = false;
    lastLeaderRenewAt = 0;
  }

  function maintainApiLeadership() {
    if (!automationActive()) {
      releaseApiLeadership();
      return false;
    }

    const now = Date.now();
    const lease = readApiLeaderLease();
    if (lease?.id === TAB_ID && Number(lease.expiresAt) > now) {
      if (now - lastLeaderRenewAt >= API_LEADER_RENEW_MS) {
        const renewed = { id: TAB_ID, expiresAt: now + API_LEADER_LEASE_MS };
        try { localStorage.setItem(TAB_LEADER_STORE, JSON.stringify(renewed)); } catch {}
        lastLeaderRenewAt = now;
      }
      wasApiLeader = true;
      return true;
    }

    if (lease?.id && Number(lease.expiresAt) > now) {
      wasApiLeader = false;
      return false;
    }

    const candidate = { id: TAB_ID, expiresAt: now + API_LEADER_LEASE_MS };
    try { localStorage.setItem(TAB_LEADER_STORE, JSON.stringify(candidate)); } catch {}
    const confirmed = readApiLeaderLease();
    const won = confirmed?.id === TAB_ID && Number(confirmed.expiresAt) > now;
    if (won && !wasApiLeader) resetPollTimers();
    wasApiLeader = won;
    if (won) lastLeaderRenewAt = now;
    return won;
  }

  function tabApiRole() {
    if (!automationActive()) return '—';
    return isApiLeader() ? 'LEADER' : 'FOLLOWER';
  }

  function saveNow() {
    clearTimeout(saveTimer);
    saveTimer = null;
    state.schemaVersion = SCHEMA_VERSION;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (error) {
      console.warn('[Merc-C-Que] State save failed:', error);
    }
    persistPdaUiState();
    publishSharedState();
  }
'''
          replace_once(old_save, new_save, 'shared state/save functions')

          replace_once(
              "  async function syncTornClock({ force = false } = {}) {\n    if (!hasApiKey() || tornClockSyncInFlight) return false;",
              "  async function syncTornClock({ force = false } = {}) {\n    if (!isApiLeader() || !hasApiKey() || tornClockSyncInFlight) return false;",
              'leader-only clock sync'
          )

          replace_once(
              "  async function pollAttacks({ forceBaseline = false, reconciliation = false } = {}) {\n    if (attackInFlight || !hasApiKey()) return;",
              "  async function pollAttacks({ forceBaseline = false, reconciliation = false } = {}) {\n    if (!isApiLeader() || attackInFlight || !hasApiKey()) return;",
              'leader-only attack poll'
          )

          replace_once(
              "    try {\n      const attacks = Array.isArray(data?.attacks) ? data.attacks : [];",
              "    try {\n      if (!isApiLeader()) return;\n      const attacks = Array.isArray(data?.attacks) ? data.attacks : [];",
              'attack response leader check'
          )

          replace_once(
              "  async function pollChain({ reconciliation = false } = {}) {\n    if (chainInFlight || !hasApiKey()) return;",
              "  async function pollChain({ reconciliation = false } = {}) {\n    if (!isApiLeader() || chainInFlight || !hasApiKey()) return;",
              'leader-only chain poll'
          )

          replace_once(
              "    try {\n      const before = chainSnapshot();",
              "    try {\n      if (!isApiLeader()) return;\n      const before = chainSnapshot();",
              'chain response leader check'
          )

          replace_once(
              "  async function reconcileAfterResume(reason = 'resume') {\n    if (reconciliationInFlight || !automationActive()) return;\n    reconciliationInFlight = true;",
              "  async function reconcileAfterResume(reason = 'resume') {\n    if (reconciliationInFlight || !automationActive()) return;\n    if (!maintainApiLeadership()) {\n      refresh({ settings: true });\n      return;\n    }\n    reconciliationInFlight = true;",
              'resume leader gate'
          )

          replace_once(
              "    if (automationActive()) {\n      syncTornClock().finally(() => pollChain());\n      pollAttacks({ forceBaseline: !state.api.baselineReady });\n    }",
              "    if (automationActive() && maintainApiLeadership()) {\n      syncTornClock().finally(() => pollChain());\n      pollAttacks({ forceBaseline: !state.api.baselineReady });\n    }",
              'settings leader gate'
          )

          old_scheduler = '''  function schedulerTick() {
    trackUpTimer();
    runDangerAlerts();
    if (!(IS_PDA && launcherDismissedForSession)) {
      if (state.minimized) refreshLauncher();
      else refreshLiveIndicators();
    }
    if (!automationActive() || inBackoff()) return;
    const now = Date.now();
    if (!tornClockSyncedAt || now - tornClockSyncedAt >= TORN_CLOCK_SYNC_INTERVAL_MS) syncTornClock();
    if (now - Number(state.api.lastAttackPoll || 0) >= desiredPollSeconds(state.api.attackPollSeconds) * 1000) pollAttacks();
    if (now - Number(state.api.lastChainPoll || 0) >= desiredPollSeconds(state.api.chainPollSeconds) * 1000) pollChain();
  }
'''
          new_scheduler = '''  function schedulerTick() {
    trackUpTimer();
    const leader = maintainApiLeadership();
    if (leader) runDangerAlerts();
    if (!(IS_PDA && launcherDismissedForSession)) {
      if (state.minimized) refreshLauncher();
      else refreshLiveIndicators();
    }
    if (!automationActive() || !leader || inBackoff()) return;
    const now = Date.now();
    if (!tornClockSyncedAt || now - tornClockSyncedAt >= TORN_CLOCK_SYNC_INTERVAL_MS) syncTornClock();
    if (now - Number(state.api.lastAttackPoll || 0) >= desiredPollSeconds(state.api.attackPollSeconds) * 1000) pollAttacks();
    if (now - Number(state.api.lastChainPoll || 0) >= desiredPollSeconds(state.api.chainPollSeconds) * 1000) pollChain();
  }
'''
          replace_once(old_scheduler, new_scheduler, 'leader scheduler')

          replace_once(
              "      `<br>Status: ${escapeHtml(state.api.status || '—')}` +\n      `<br>Current chain: ${state.api.chainCurrent ?? '—'} | Next hit: ${nextHitNumber()}` +",
              "      `<br>Status: ${escapeHtml(state.api.status || '—')}` +\n      `<br>Tab API role: <strong>${tabApiRole()}</strong>` +\n      `<br>Current chain: ${state.api.chainCurrent ?? '—'} | Next hit: ${nextHitNumber()}` +",
              'API role status'
          )

          replace_once(
              "      pdaStorage: !!PDA_STORAGE,\n      mode: state.api.mode,",
              "      pdaStorage: !!PDA_STORAGE,\n      tabSync: { tabId: TAB_ID, apiRole: tabApiRole(), broadcastChannel: !!syncChannel },\n      mode: state.api.mode,",
              'debug tab sync'
          )

          replace_once(
              "  window.addEventListener('pagehide', () => {\n    // Flush any debounced save; saveNow() also persists PDA UI state.\n    if (saveTimer) saveNow();\n    else persistPdaUiState();\n  });",
              "  window.addEventListener('pagehide', () => {\n    // Flush any debounced save; saveNow() also persists PDA UI state.\n    if (saveTimer) saveNow();\n    else persistPdaUiState();\n    releaseApiLeadership();\n  });",
              'pagehide leadership release'
          )

          replace_once(
              "  trackUpTimer();\n  renderApp();\n  setInterval(ensureMounted, 2500);\n  startScheduler();\n\n  if (automationActive()) {\n    resetPollTimers();\n    if (!state.api.baselineReady) pollAttacks({ forceBaseline: true });\n    syncTornClock({ force: true }).finally(() => pollChain());\n  }",
              "  initTabSync();\n  trackUpTimer();\n  renderApp();\n  setInterval(ensureMounted, 2500);\n  startScheduler();\n\n  if (automationActive() && maintainApiLeadership()) {\n    resetPollTimers();\n    if (!state.api.baselineReady) pollAttacks({ forceBaseline: true });\n    syncTornClock({ force: true }).finally(() => pollChain());\n  }",
              'startup tab sync and leader gate'
          )

          path.write_text(text, encoding='utf-8')
          PY

          node --check HKs-Merc-C-Que.user.js
          grep -Fq '// @version      2.5.12' HKs-Merc-C-Que.user.js
          grep -Fq "const VERSION = '2.5.12';" HKs-Merc-C-Que.user.js
          grep -Fq 'v2.5.12-multitab-sync/HKs-Merc-C-Que.user.js' HKs-Merc-C-Que.user.js
          grep -Fq 'new BroadcastChannel(TAB_SYNC_CHANNEL_NAME)' HKs-Merc-C-Que.user.js
          grep -Fq 'API_LEADER_LEASE_MS = 4000' HKs-Merc-C-Que.user.js
          grep -Fq 'Tab API role:' HKs-Merc-C-Que.user.js
      - name: Commit v2.5.12 multi-tab build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HKs-Merc-C-Que.user.js
          git commit -m 'Add v2.5.12 multi-tab synchronization'
          git push origin HEAD:v2.5.12-multitab-sync
