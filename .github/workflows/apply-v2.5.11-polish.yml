name: Apply v2.5.11 polish

on:
  push:
    branches:
      - v2.5.11-clock-safety
    paths:
      - .github/workflows/apply-v2.5.11-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5.11-clock-safety

      - name: Apply polish and verify
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('HKs-Merc-C-Que.user.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "  const PDA_PANEL_POSITION_STORE = 'ui_panel_position';\n",
              "  const PDA_PANEL_POSITION_STORE = 'ui_panel_position';\n  const PDA_SESSION_DISMISS_STORE = 'hkmcq_pda_launcher_dismissed';\n",
              'PDA session dismiss key'
          )

          replace_once(
              "  const IS_PDA = !!(PDA_HTTP_GET || PDA_STORAGE || PDA_INJECTED_KEY);\n\n  let state = loadState();",
              "  const IS_PDA = !!(PDA_HTTP_GET || PDA_STORAGE || PDA_INJECTED_KEY);\n\n  function readPdaDismissedForSession() {\n    if (!IS_PDA) return false;\n    try { return sessionStorage.getItem(PDA_SESSION_DISMISS_STORE) === '1'; }\n    catch { return false; }\n  }\n\n  function writePdaDismissedForSession(dismissed) {\n    if (!IS_PDA) return;\n    try {\n      if (dismissed) sessionStorage.setItem(PDA_SESSION_DISMISS_STORE, '1');\n      else sessionStorage.removeItem(PDA_SESSION_DISMISS_STORE);\n    } catch {}\n  }\n\n  let state = loadState();",
              'PDA session dismiss helpers'
          )

          replace_once(
              "  let suppressLauncherClickUntil = 0;\n  let launcherDismissedForSession = false;\n  let lastVisibilityChangeAt = Date.now();",
              "  let suppressLauncherClickUntil = 0;\n  let launcherDismissedForSession = readPdaDismissedForSession();\n  let pointerMoveFrame = 0;\n  let pendingPointerMove = null;\n  let lastVisibilityChangeAt = Date.now();",
              'runtime polish state'
          )

          replace_once(
              "  function dismissLauncherForSession() {\n    if (!IS_PDA) return;\n    launcherDismissedForSession = true;\n    launcherDrag = null;\n    document.getElementById(LAUNCHER_ID)?.remove();\n  }",
              "  function dismissLauncherForSession() {\n    if (!IS_PDA) return;\n    launcherDismissedForSession = true;\n    writePdaDismissedForSession(true);\n    launcherDrag = null;\n    document.getElementById(LAUNCHER_ID)?.remove();\n  }",
              'persist session dismiss'
          )

          replace_once(
              "  function refresh(options = {}) {\n    if (state.minimized) return renderLauncher();",
              "  function refresh(options = {}) {\n    if (state.minimized) return refreshLauncher();",
              'smart minimized refresh'
          )

          old_refresh_launcher = """  function refreshLauncher() {
    const launcher = document.getElementById(LAUNCHER_ID);
    if (!launcher) return renderLauncher();
    launcher.className = launcherStateClasses();
    const text = launcherLabel();
    const label = launcher.querySelector('#hkmcq-launcher-label');
    if (label) label.textContent = text;
    launcher.title = `Merc-C-Que — ${text} — ${state.api.status || state.api.mode}`;
  }
"""
          new_refresh_launcher = """  function refreshLauncher() {
    if (IS_PDA && launcherDismissedForSession) {
      document.getElementById(LAUNCHER_ID)?.remove();
      return;
    }
    const launcher = document.getElementById(LAUNCHER_ID);
    if (!launcher) return renderLauncher();
    launcher.className = launcherStateClasses();
    const text = launcherLabel();
    const label = launcher.querySelector('#hkmcq-launcher-label');
    if (label && label.textContent !== text) label.textContent = text;

    const pendingCount = state.api.pendingHits.length;
    let badge = launcher.querySelector('.launcherBadge');
    if (pendingCount > 0) {
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'launcherBadge';
        launcher.appendChild(badge);
      }
      const badgeText = pendingCount > 99 ? '99+' : String(pendingCount);
      if (badge.textContent !== badgeText) badge.textContent = badgeText;
      badge.title = `${pendingCount} hit${pendingCount === 1 ? '' : 's'} waiting for attention`;
    } else if (badge) {
      badge.remove();
    }

    launcher.title = `Merc-C-Que — ${text} — ${state.api.status || state.api.mode}`;
  }
"""
          replace_once(old_refresh_launcher, new_refresh_launcher, 'incremental launcher refresh')

          old_scheduler = """  function schedulerTick() {
    trackUpTimer();
    runDangerAlerts();
    if (state.minimized) refreshLauncher();
    else refreshLiveIndicators();
    if (!automationActive() || inBackoff()) return;
    const now = Date.now();
    if (now - Number(state.api.lastAttackPoll || 0) >= desiredPollSeconds(state.api.attackPollSeconds) * 1000) pollAttacks();
    if (now - Number(state.api.lastChainPoll || 0) >= desiredPollSeconds(state.api.chainPollSeconds) * 1000) pollChain();
  }
"""
          new_scheduler = """  function schedulerTick() {
    trackUpTimer();
    runDangerAlerts();
    if (!(IS_PDA && launcherDismissedForSession)) {
      if (state.minimized) refreshLauncher();
      else refreshLiveIndicators();
    }
    if (!automationActive() || inBackoff()) return;
    const now = Date.now();
    if (now - Number(state.api.lastAttackPoll || 0) >= desiredPollSeconds(state.api.attackPollSeconds) * 1000) pollAttacks();
    if (now - Number(state.api.lastChainPoll || 0) >= desiredPollSeconds(state.api.chainPollSeconds) * 1000) pollChain();
  }

  function schedulerDelay() {
    const now = Date.now();
    const observedAt = Number(state.api.chainTimeoutObservedAt) || 0;
    const phase = observedAt > 0 ? Math.max(0, now - observedAt) % 1000 : now % 1000;
    return Math.max(100, 1000 - phase + 15);
  }

  function startScheduler() {
    const run = () => {
      schedulerTick();
      setTimeout(run, schedulerDelay());
    };
    setTimeout(run, schedulerDelay());
  }
"""
          replace_once(old_scheduler, new_scheduler, 'drift-corrected scheduler')

          old_pointermove = """  document.addEventListener('pointermove', event => {
    if (panelDrag && event.pointerId === panelDrag.pointerId) {
      const panel = document.getElementById(PANEL_ID);
      if (panel) {
        setPosition(panel, clampPanelPosition(event.clientX - panelDrag.offsetX, event.clientY - panelDrag.offsetY, panel));
        panel.style.right = 'auto';
        adjustPanelViewport();
      }
    }
    if (launcherDrag && event.pointerId === launcherDrag.pointerId) {
      const launcher = document.getElementById(LAUNCHER_ID);
      if (launcher) {
        if (Math.abs(event.clientX - launcherDrag.startX) > 3 || Math.abs(event.clientY - launcherDrag.startY) > 3) launcherDrag.moved = true;
        setPosition(launcher, clampLauncherPosition(event.clientX - launcherDrag.offsetX, event.clientY - launcherDrag.offsetY, launcher));
      }
    }
    if (rosterDrag && event.pointerId === rosterDrag.pointerId) {
      const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(`#${PANEL_ID} .row`);
      document.querySelectorAll(`#${PANEL_ID} .row.dragover`).forEach(element => element.classList.remove('dragover'));
      if (target) {
        target.classList.add('dragover');
        rosterDrag.targetIndex = Number(target.dataset.index);
      }
    }
  });
"""
          new_pointermove = """  function applyPointerMove(point) {
    if (!point) return;
    const { pointerId, clientX, clientY } = point;
    if (panelDrag && pointerId === panelDrag.pointerId) {
      const panel = document.getElementById(PANEL_ID);
      if (panel) {
        setPosition(panel, clampPanelPosition(clientX - panelDrag.offsetX, clientY - panelDrag.offsetY, panel));
        panel.style.right = 'auto';
        adjustPanelViewport();
      }
    }
    if (launcherDrag && pointerId === launcherDrag.pointerId) {
      const launcher = document.getElementById(LAUNCHER_ID);
      if (launcher) {
        if (Math.abs(clientX - launcherDrag.startX) > 3 || Math.abs(clientY - launcherDrag.startY) > 3) launcherDrag.moved = true;
        setPosition(launcher, clampLauncherPosition(clientX - launcherDrag.offsetX, clientY - launcherDrag.offsetY, launcher));
      }
    }
    if (rosterDrag && pointerId === rosterDrag.pointerId) {
      const target = document.elementFromPoint(clientX, clientY)?.closest(`#${PANEL_ID} .row`);
      document.querySelectorAll(`#${PANEL_ID} .row.dragover`).forEach(element => element.classList.remove('dragover'));
      if (target) {
        target.classList.add('dragover');
        rosterDrag.targetIndex = Number(target.dataset.index);
      }
    }
  }

  function flushPointerMove() {
    pointerMoveFrame = 0;
    const point = pendingPointerMove;
    pendingPointerMove = null;
    applyPointerMove(point);
  }

  function flushPendingPointerMove() {
    if (!pendingPointerMove) return;
    if (pointerMoveFrame) cancelAnimationFrame(pointerMoveFrame);
    flushPointerMove();
  }

  document.addEventListener('pointermove', event => {
    pendingPointerMove = {
      pointerId: event.pointerId,
      clientX: event.clientX,
      clientY: event.clientY
    };
    if (!pointerMoveFrame) pointerMoveFrame = requestAnimationFrame(flushPointerMove);
  });
"""
          replace_once(old_pointermove, new_pointermove, 'animation-frame pointer batching')

          replace_once(
              "  document.addEventListener('pointerup', event => {\n    if (panelDrag && event.pointerId === panelDrag.pointerId) {",
              "  document.addEventListener('pointerup', event => {\n    if (pendingPointerMove?.pointerId === event.pointerId) flushPendingPointerMove();\n    if (panelDrag && event.pointerId === panelDrag.pointerId) {",
              'flush drag before pointerup'
          )

          replace_once(
              "  document.addEventListener('pointercancel', () => {\n    panelDrag = null;\n    launcherDrag = null;\n    rosterDrag = null;\n    clearRosterDragClasses();\n  });",
              "  document.addEventListener('pointercancel', () => {\n    if (pointerMoveFrame) cancelAnimationFrame(pointerMoveFrame);\n    pointerMoveFrame = 0;\n    pendingPointerMove = null;\n    panelDrag = null;\n    launcherDrag = null;\n    rosterDrag = null;\n    clearRosterDragClasses();\n  });",
              'cancel queued pointer work'
          )

          replace_once(
              "  setInterval(ensureMounted, 2500);\n  setInterval(schedulerTick, 1000);",
              "  setInterval(ensureMounted, 2500);\n  startScheduler();",
              'start drift-corrected scheduler'
          )

          path.write_text(text, encoding='utf-8')
          PY

          node --check HKs-Merc-C-Que.user.js
          grep -q "PDA_SESSION_DISMISS_STORE" HKs-Merc-C-Que.user.js
          grep -q "requestAnimationFrame(flushPointerMove)" HKs-Merc-C-Que.user.js
          grep -q "function startScheduler" HKs-Merc-C-Que.user.js
          grep -q "if (state.minimized) return refreshLauncher();" HKs-Merc-C-Que.user.js
          grep -q "CHAIN_CLOCK_SAFETY_SECONDS = 3" HKs-Merc-C-Que.user.js
          grep -q "current < 10" HKs-Merc-C-Que.user.js

      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HKs-Merc-C-Que.user.js
          git commit -m "Polish PDA interaction and live UI updates"
          git push origin HEAD:v2.5.11-clock-safety
