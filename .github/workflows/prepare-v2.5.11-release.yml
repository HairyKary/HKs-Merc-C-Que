name: Prepare v2.5.11 release

on:
  push:
    branches:
      - v2.5.11-clock-safety
    paths:
      - .github/workflows/prepare-v2.5.11-release.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5.11-clock-safety
      - name: Point updater to main
        run: |
          sed -i 's#HairyKary/HKs-Merc-C-Que/v2.5.11-clock-safety/HKs-Merc-C-Que.user.js#HairyKary/HKs-Merc-C-Que/main/HKs-Merc-C-Que.user.js#g' HKs-Merc-C-Que.user.js
          node --check HKs-Merc-C-Que.user.js
          grep -Fq '// @version      2.5.11' HKs-Merc-C-Que.user.js
          grep -Fq '// @updateURL    https://raw.githubusercontent.com/HairyKary/HKs-Merc-C-Que/main/HKs-Merc-C-Que.user.js' HKs-Merc-C-Que.user.js
          grep -Fq 'const CHAIN_CLOCK_SAFETY_SECONDS = 3;' HKs-Merc-C-Que.user.js
          grep -Fq 'const TORN_CLOCK_SYNC_INTERVAL_MS = 60000;' HKs-Merc-C-Que.user.js
      - name: Commit release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HKs-Merc-C-Que.user.js
          git commit -m 'Point v2.5.11 updates to main' || exit 0
          git push origin HEAD:v2.5.11-clock-safety
